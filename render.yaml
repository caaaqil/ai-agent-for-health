services:
  - type: web
    name: ai-agent-for-health
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      # Secrets — Render will prompt you to enter these in the dashboard:
      - key: MONGO_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
